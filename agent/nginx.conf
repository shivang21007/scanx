server {
    listen 80;
    server_name _;

    # Root directory for binaries
    root /usr/share/nginx/html;

    # Serve checksums.json files with proper JSON content type
    location ~ ^/api/updates/download/([^/]+)/builds/checksums\.json$ {
        alias /usr/share/nginx/html/$1/builds/checksums.json;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location ~ ^/api/updates/download/([^/]+)/builds-osqueryi/checksums\.json$ {
        alias /usr/share/nginx/html/$1/builds-osqueryi/checksums.json;
        default_type application/json;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Serve scanx binaries
    location ~ ^/api/updates/download/([^/]+)/builds/(.+)$ {
        alias /usr/share/nginx/html/$1/builds/$2;
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="$2"';
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Serve osqueryi binaries
    location ~ ^/api/updates/download/([^/]+)/builds-osqueryi/(.+)$ {
        alias /usr/share/nginx/html/$1/builds-osqueryi/$2;
        default_type application/octet-stream;
        add_header Content-Disposition 'attachment; filename="$2"';
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Health check
    location /health {
        access_log off;
        return 200 "agent container healthy\n";
        add_header Content-Type text/plain;
    }
}
