# ============================================
# Rate Limiting Zones
# ============================================

# # General API rate limiting (100 req/min per IP)
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

# # Strict rate limiting for authentication endpoints (100 req/min per IP)
# limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=100r/m;

# # Agent data submission (100 req/min - agents report frequently)
# limit_req_zone $binary_remote_addr zone=agent_limit:10m rate=100r/m;

# # Define response for rate limit violations
# limit_req_status 429;

server {
    listen 80;
    server_name localhost 127.0.0.1 172.0.10.183 192.168.22.22 _;
    root /usr/share/nginx/html;
    index index.html;

    # Enable gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Custom error page for rate limiting
    error_page 429 /429.html;
    location = /429.html {
        root /usr/share/nginx/html;
        internal;
        add_header Content-Type "text/html; charset=utf-8" always;
    }

    # Handle static assets with long cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Strict rate limit for authentication endpoints
    # Matches: /api/auth/login, /api/auth/register, /api/auth/me, /api/auth/logout
    location ~ ^/api/auth/(login|register|me|logout|delete|admins) {
        # limit_req zone=auth_limit burst=5 nodelay;
        # limit_req_log_level warn;
        
        # Custom error page for rate limiting
        error_page 429 /429.html;
        
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;  # Includes port
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Handle CORS
        proxy_set_header Origin $http_origin;
        proxy_set_header Access-Control-Request-Method $http_access_control_request_method;
        proxy_set_header Access-Control-Request-Headers  $http_access_control_request_headers;
    }

    # Rate limit for agent data submission
    # Matches: /api/devices/agent/report (POST from agents)
    location ~ ^/api/devices/agent/report$ {
        # limit_req zone=agent_limit burst=20 nodelay;
        # limit_req_log_level warn;
        
        # Custom error page for rate limiting
        error_page 429 /429.html;
        
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;  # Includes port
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Update check endpoint
    location /api/updates/download {
        # limit_req zone=agent_limit burst=20 nodelay;
        # limit_req_log_level warn;
        
        # Custom error page for rate limiting
        error_page 429 /429.html;
        
        proxy_pass http://agent:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;  # Includes port
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
    # General API rate limiting (100 req/min)
    location /api/ {
        # limit_req zone=api_limit burst=10 nodelay;
        # limit_req_log_level warn;
        
        # Custom error page for rate limiting
        error_page 429 /429.html;
        
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_host;  # Includes port
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Handle CORS
        proxy_set_header Origin $http_origin;
        proxy_set_header Access-Control-Request-Method $http_access_control_request_method;
        proxy_set_header Access-Control-Request-Headers  $http_access_control_request_headers;
    }

    # SPA fallback - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
