services:
  mysql:
    image: mysql:latest
    container_name: mysql-scanx-1
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=admin@123
      - MYSQL_DATABASE=scanx
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=Shivang@123
    networks:
      - scanx-network
    volumes:
      - mysql-scanx:/var/lib/mysql 
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

  redis:
    image: redis:latest
    container_name: redis-scanx-1
    restart: unless-stopped
    command: redis-server --requirepass admin@123
    networks:
      - scanx-network
    volumes:
      - redis-scanx:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "admin@123", "ping"]
      timeout: 10s
      retries: 10

  # Conditional postfix service (only if host postfix not available)
  postfix:
    image: boky/postfix:latest
    container_name: postfix-scanx-1
    environment:
      - ALLOWED_SENDER_DOMAINS=${POSTFIX_ALLOWED_DOMAINS:-octro.com octrotalk.com localhost}
    networks:
      - scanx-network
    profiles:
      - postfix-container  # Only start if explicitly enabled
    depends_on:
       redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "25"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-scanx-1
    restart: unless-stopped
    depends_on:
       mysql:
        condition: service_healthy
       redis:
        condition: service_healthy
    networks:
      - scanx-network
    env_file:
      - ./backend/.env.docker
    environment:
      # Pass OSQUERY_BINARY_REQUIRED to backend so it knows if osqueryi updates are mandatory
      - OSQUERY_BINARY_REQUIRED=${OSQUERY_BINARY_REQUIRED}
      # Pass versions from agent.conf (read by docker-compose-helper.sh)
      - SCANX_VERSION=${SCANX_VERSION}
      - OSQUERYI_VERSION=${OSQUERYI_VERSION}
      # SMTP configuration
      - HOST_POSTFIX_AVAILABLE=${HOST_POSTFIX_AVAILABLE}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_SECURE=${SMTP_SECURE:-}
    command: ["/bin/sh", "/app/entrypoint.sh"]

  device-purge-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: device-purge-worker-scanx-1
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - scanx-network
    env_file:
      - ./backend/.env.docker
    command: ["bun", "run", "worker:purge"]

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
      args:
        - VERSION=${SCANX_VERSION}
        - OSQUERY_BINARY_REQUIRED=${OSQUERY_BINARY_REQUIRED}
    container_name: agent-scanx-1
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - scanx-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_ENABLE_REGISTER_ENDPOINT=true
    container_name: frontend-scanx-1
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - scanx-network

volumes:
  mysql-scanx:
  redis-scanx:
networks:
  scanx-network:
    driver: bridge  
