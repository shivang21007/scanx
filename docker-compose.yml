services:
  mysql:
    # Pinned deliberately. An unpinned `latest` will silently jump major versions
    # on any pull, which can leave the existing datadir unreadable.
    image: mysql:9.5.0
    container_name: mysql-scanx-1
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=admin@123
      - MYSQL_DATABASE=scanx
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=Shivang@123
    networks:
      - scanx-network
    volumes:
      - mysql-scanx:/var/lib/mysql 
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 10s
      retries: 10

  redis:
    # Pinned: see the mysql note above.
    image: redis:8.4.0
    container_name: redis-scanx-1
    restart: unless-stopped
    command: redis-server --requirepass admin@123
    networks:
      - scanx-network
    volumes:
      - redis-scanx:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "admin@123", "ping"]
      timeout: 10s
      retries: 10

  # Conditional postfix service (only if host postfix not available)
  postfix:
    # Pinned: see the mysql note above.
    image: boky/postfix:v4.4.0
    container_name: postfix-scanx-1
    environment:
      - ALLOWED_SENDER_DOMAINS=${POSTFIX_ALLOWED_DOMAINS:-octro.com octrotalk.com localhost}
    networks:
      - scanx-network
    profiles:
      - postfix-container  # Only start if explicitly enabled
    depends_on:
       redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "25"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend-scanx-1
    restart: unless-stopped
    depends_on:
       mysql:
        condition: service_healthy
       redis:
        condition: service_healthy
       # Ordering only: the OTLP exporter retries, so a late collector is fine.
       otel-collector:
        condition: service_started
    networks:
      - scanx-network
    env_file:
      - ./backend/.env.docker
    environment:
      # Pass OSQUERY_BINARY_REQUIRED to backend so it knows if osqueryi updates are mandatory
      - OSQUERY_BINARY_REQUIRED=${OSQUERY_BINARY_REQUIRED}
      # Pass versions from agent.conf (read by docker-compose-helper.sh)
      - SCANX_VERSION=${SCANX_VERSION}
      - OSQUERYI_VERSION=${OSQUERYI_VERSION}
      # SMTP configuration
      - HOST_POSTFIX_AVAILABLE=${HOST_POSTFIX_AVAILABLE}
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-}
      - SMTP_SECURE=${SMTP_SECURE:-}
    volumes:
      - scanx-backend-logs:/app/logs
    command: ["/bin/sh", "/app/entrypoint.sh"]

  device-purge-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: device-purge-worker-scanx-1
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - scanx-network
    env_file:
      - ./backend/.env.docker
    volumes:
      - scanx-purge-worker-logs:/app/logs
    command: ["bun", "run", "worker:purge"]

  agent:
    build:
      context: ./agent
      dockerfile: Dockerfile
      args:
        - VERSION=${SCANX_VERSION}
        - OSQUERY_BINARY_REQUIRED=${OSQUERY_BINARY_REQUIRED}
    container_name: agent-scanx-1
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - scanx-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
        - VITE_ENABLE_REGISTER_ENDPOINT=true
    container_name: frontend-scanx-1
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - scanx-network
    volumes:
      - scanx-frontend-logs:/var/log/nginx

  # ---------------------------------------------------------------------------
  # Observability: OpenObserve stores logs/metrics; the OTel Collector is the
  # single ingress that feeds it (backend logs via OTLP, plus container and host
  # metrics it scrapes itself).
  # ---------------------------------------------------------------------------
  openobserve:
    # Pinned: see the mysql note above.
    image: public.ecr.aws/zinclabs/openobserve:v1.0.2
    container_name: openobserve-scanx-1
    restart: unless-stopped
    environment:
      - ZO_ROOT_USER_EMAIL=${OO_ROOT_USER_EMAIL:?set OO_ROOT_USER_EMAIL in .env}
      - ZO_ROOT_USER_PASSWORD=${OO_ROOT_USER_PASSWORD:?set OO_ROOT_USER_PASSWORD in .env}
      - ZO_LOCAL_MODE=true
      - ZO_DATA_DIR=/data
      - ZO_TELEMETRY=false
      # Default retention is ~10 years, which would silently fill the disk.
      - ZO_COMPACT_DATA_RETENTION_DAYS=${OO_RETENTION_DAYS:-30}
    ports:
      - "${OO_PORT:-5080}:5080"
    networks:
      - scanx-network
    volumes:
      - openobserve-scanx:/data

  otel-collector:
    # Pinned: see the mysql note above. `-contrib` is required for the
    # docker_stats receiver; the core image does not ship it.
    image: otel/opentelemetry-collector-contrib:0.111.0
    container_name: otel-collector-scanx-1
    restart: unless-stopped
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    environment:
      - OO_ORG=${OO_ORG:-default}
      - OO_AUTH_HEADER=${OO_AUTH_HEADER:?set OO_AUTH_HEADER in .env}
    # The image runs as uid 10001, but /var/run/docker.sock is root:docker 0660
    # on Linux hosts, so docker_stats gets EACCES without the docker group.
    # Set DOCKER_GID in .env to the host's docker gid (`getent group docker`).
    group_add:
      - "${DOCKER_GID:-0}"
    networks:
      - scanx-network
    depends_on:
      - openobserve
    volumes:
      - ./otel/collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      # Read-only docker socket: the docker_stats receiver reads container stats.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # hostmetrics reads the host's /proc and /sys through this mount.
      - /:/hostfs:ro

volumes:
  mysql-scanx:
  redis-scanx:
  openobserve-scanx:
  scanx-backend-logs:
    name: scanx-backend-logs
  scanx-purge-worker-logs:
    name: scanx-purge-worker-logs
  scanx-frontend-logs:
    name: scanx-frontend-logs
networks:
  scanx-network:
    driver: bridge  
